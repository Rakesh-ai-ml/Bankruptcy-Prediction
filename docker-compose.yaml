name : bankruptcy
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: bankruptcyfastapi:latest   
    container_name: bankruptcyfastapi
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: bankruptcystreamlit:latest  # custom image name
    container_name: bankruptcystreamlit
    ports:
      - "8501:8501"
    depends_on:
      - backend
